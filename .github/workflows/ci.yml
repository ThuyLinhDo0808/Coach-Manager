name: CI

# Chỉ chạy khi push lên main hoặc khi có PR. Không có lịch chạy định kỳ (phút Actions dùng chung tài khoản).
# Nhánh có PR chỉ chạy một lần (sự kiện pull_request), không chạy trùng cho push.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
